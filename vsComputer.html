<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Tic Tac Toe</title>
</head>
<body class="bg-dark text-light">

    <div id="preloader"></div>

    <div class="container-fluid position-fixed top-0 start-0">
        <a href="index.html" class="btn btn-outline-light m-2">
            &larr; Back
        </a>
    </div>

    <div class="game-container">
        <h1 class="display-5 text-warning">Tic-tac-toe vs Computer</h1>
        <p class="game-status" id="player">Your Turn</p>

        <div class="d-flex justify-content-center align-items-center">
            <table class="text-center">
                <tr>
                    <td>
                        <button class="btn btn-outline-primary game-btn" style="height: 85px; width: 85px;" id="btn1" value="1"> </button>
                    </td>
                    <td>
                        <button class="btn btn-outline-primary game-btn" style="height: 85px; width: 85px;" id="btn2" value="2"></button>
                    </td>
                    <td>
                        <button class="btn btn-outline-primary game-btn" style="height: 85px; width: 85px;" id="btn3" value="3"> </button>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button class="btn btn-outline-primary game-btn" style="height: 85px; width: 85px;" id="btn4" value="4"> </button>
                    </td>
                    <td>
                        <button class="btn btn-outline-primary game-btn" style="height: 85px; width: 85px;" id="btn5" value="5"> </button>
                    </td>
                    <td>
                        <button class="btn btn-outline-primary game-btn" style="height: 85px; width: 85px;" id="btn6" value="6"> </button>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button class="btn btn-outline-primary game-btn" style="height: 85px; width: 85px;" id="btn7" value="7"> </button>
                    </td>
                    <td>
                        <button class="btn btn-outline-primary game-btn" style="height: 85px; width: 85px;" id="btn8" value="8"> </button>
                    </td>
                    <td>
                        <button class="btn btn-outline-primary game-btn" style="height: 85px; width: 85px;" id="btn9" value="9"> </button>
                    </td>
                </tr>
            </table>
        </div>
        <div class="d-flex justify-content-center align-items-center mt-3">
            <button class="btn btn-outline-primary px-4" onclick="btnReloadClick()">New Game</button>
        </div>
    </div>

    <footer class="bg-secondary text-light py-2">
        <div class="container d-flex flex-wrap justify-content-between align-items-center">
            <div class="col-md-4 d-flex align-items-center">
                <span class="text-light">© 2025 Sadeepa N Herath</span>
            </div>
            <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
                <li class="ms-3"><a class="text-light" href="https://github.com/SadeepaNHerath" target="_blank"><i class="bi bi-github"></i></a></li>
                <li class="ms-3"><a class="text-light" href="https://www.tiktok.com/@sadeepanherath?_t=8p3J8dyFl5k&_r=1" target="_blank"><i class="bi bi-tiktok"></i></a></li>
                <li class="ms-3"><a class="text-light" href="https://www.instagram.com/sadeepa_herath_18?igsh=NHg2emxpeHpnZnJu" target="_blank"><i class="bi bi-instagram"></i></a></li>
                <li class="ms-3"><a class="text-light" href="https://www.facebook.com/SadeepaNHerath?mibextid=ZbWKwL" target="_blank"><i class="bi bi-facebook"></i></a></li>
            </ul>
        </div>
    </footer>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="vsComputerApp.js"></script>
</body>
</html>
